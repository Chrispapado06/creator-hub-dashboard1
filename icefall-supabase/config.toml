# Minimal project config. `supabase link --project-ref …` fills in the rest.
project_id = "icefall"

[db]
major_version = 15

# ---------------------------------------------------------------------------
# Edge functions
# ---------------------------------------------------------------------------

# STRAVA — the platform's JWT gate is OFF, and the function does the check itself.
#
# THIS IS NOT A RELAXATION. `/strava/callback` is a TOP-LEVEL BROWSER REDIRECT
# sent by Strava: it carries no Authorization header and never can, so with the
# gateway's default `verify_jwt = true` every consent would be answered with a
# 401 before a line of our code ran, and the connection could never complete.
#
# The other three routes are authenticated by `callerId()` inside the function,
# which VERIFIES the caller's JWT by asking Supabase who it belongs to rather
# than decoding it locally — the same check the gateway would have done, and
# each route refuses with 401 without it.
#
# The callback is protected instead by the thing that actually fits it: a
# single-use `state` minted server-side, bound to one user, consumed atomically
# and expiring in ten minutes. See migration 20260907140000.
[functions.strava]
verify_jwt = false

# WATCH — same reasoning as [functions.strava] above, for the same reason.
# /watch/<provider>/callback is a top-level browser redirect sent by Garmin,
# COROS, Suunto or Polar: it carries no Authorization header and never can.
# Every other route calls callerId() and refuses with 401 without a verified JWT.
[functions.watch]
verify_jwt = false

# ---------------------------------------------------------------------------
# Auth
# ---------------------------------------------------------------------------
#
# EVERY KEY BELOW IS PUSHED TO THE LIVE PROJECT by `supabase config push`, and
# the CLI pushes WITHOUT ASKING in a non-interactive shell — learned the hard
# way on 2026-09-07, when a push meant to switch off email confirmation also
# reset site_url to 127.0.0.1, wiped the redirect allowlist and disabled TOTP.
# So the section is written out in full with the values the project actually
# wants, and nothing is left to the CLI's local-development defaults.
#
# Email confirmation is OFF (owner, 2026-09-07: "make the damn signup work"):
# no mail provider is connected, so a confirmation email could never arrive
# and every sign-up stalled. Trade-off, stated plainly: an address is accepted
# as typed and is not proven to belong to the person. Switch it back on the
# day an SMTP provider is connected.
[auth]
enabled = true
site_url = "https://icefall-app-icefall.vercel.app"
additional_redirect_urls = [
  "https://icefall-app-icefall.vercel.app/**",
  "https://icefall-app-livid.vercel.app/**",
  "https://icefall-*-icefall.vercel.app/**",
  "http://localhost:5190/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# ON again as of 2026-09-07 (owner: "i want the email confirmation to work tho"),
# because a real mail provider now sends the link — see [auth.email.smtp].
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# Resend, connected 2026-09-07. The password is the Resend API key and is read
# from the shell at push time — `RESEND_API_KEY=… npx supabase config push` —
# so it is never written into this file or the repository.
#
# SENDER ADDRESS: theicefall.com was verified at Resend on 2026-09-07 (DKIM +
# sending CNAMEs at Namecheap), so mail goes out from the brand's own domain
# and reaches any recipient. `no-reply@` because no mailbox exists at that
# address on the Private Email account — a reply would bounce, and the address
# says so up front. Change it to a real mailbox the day one is created.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@theicefall.com"
sender_name = "ICEFALL"

[auth.email.template.confirmation]
subject = "Confirm your ICEFALL email"
content_path = "./templates/confirmation.html"

# Supabase's built-in mailer allowed 2 emails an hour. With our own provider
# the ceiling is ours to set; 30 an hour is Supabase's own recommended figure.
[auth.rate_limit]
email_sent = 30
