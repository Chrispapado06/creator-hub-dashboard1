name: OFM Workspace — Windows build

# Builds a downloadable Windows installer (.exe, NSIS) on GitHub's Windows
# runners and publishes it to a GitHub Release, whenever a tag like `ofm-v0.1.0`
# is pushed. No repo secrets required:
#   * the Supabase anon key is a PUBLIC client key (RLS-protected), inlined below;
#   * updater artifacts are disabled for this build, so no signing key is needed;
#   * GITHUB_TOKEN (auto-provided) publishes the release.
# The macOS build + auto-update are handled separately (self-hosted on Supabase).

on:
  push:
    tags:
      - "ofm-v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ofm-workspace/src-tauri

      - name: Install frontend dependencies
        working-directory: ofm-workspace
        run: npm ci

      - name: Build & publish Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: https://jzlrwlqytyqhlpuyblld.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6bHJ3bHF5dHlxaGxwdXlibGxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjgzMDYsImV4cCI6MjEwMDkwNDMwNn0.8IaC-jGMDk95e2YgKhuGXiT0Aikb3-osjq6HKzmhh-k
          VITE_PUBLIC_VIEWER_URL: https://ofm-public-viewer.vercel.app
        with:
          projectPath: ofm-workspace
          tagName: ${{ github.ref_name }}
          releaseName: "OFM Workspace ${{ github.ref_name }}"
          releaseBody: "Windows installer (.exe) below. Download and run to install."
          releaseDraft: false
          prerelease: false
          args: '--bundles nsis --config {"bundle":{"createUpdaterArtifacts":false}}'
